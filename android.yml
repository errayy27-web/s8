name: SS OIL APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold and restore custom files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ssoil-custom
          cp -R android/app/src/main /tmp/ssoil-custom/main
          rm -rf android
          flutter create --platforms=android --org com.ssoil --project-name ss_oil_stok_kontrol .
          cp -R /tmp/ssoil-custom/main/. android/app/src/main/
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text().replace('com.ssoil.ss_oil_stok_kontrol','com.ssoil.stokkontrol')
          s=s.replace('compileSdk = flutter.compileSdkVersion','compileSdk = 36')
          p.write_text(s)
          PYCODE
      - run: flutter pub get
      - run: dart format lib/main.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: SS-OIL-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
